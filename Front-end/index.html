<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="popup-conteudo">
    <h3>Verificador de Notícias</h3>
    <p class="informacao">Clique no botão "Analisar Notícia" para iniciar a verificação da notícia.</p>
    <textarea id="textoSelecionado" placeholder="A prévia da notícia aparecerá aqui; o texto completo será analisado."></textarea>
    <button id="analisarBtn">Analisar Notícia</button>

    <div id="resultado"></div>
  </main>

  <script src="main.js"></script>
</body>
</html>
